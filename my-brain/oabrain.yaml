# The brain's manifest. Strict YAML: one document, no anchors, no block scalars.
# Full key list: docs/brains/oabrain-standard.md, section 3.

oabrain: 1
# TODO: pick your own id. Lower-case kebab-case; it becomes the folder name under Brains/.
id: my-brain
name: My Brain
version: "0.1.0"
author:
  name: "TODO: your name"
description: "TODO: what this brain does."
# 1 to 4 of: classic, economy, rush, turtle, air, naval, learned, teaching, experimental
tags:
  - experimental
# "*" is any mod and the base game; "ta-3.1c" is the base game alone.
works-with:
  - "*"
levels:
  - id: easy
    name: Easy
    difficulty: easy
  - id: medium
    name: Medium
    difficulty: medium
  - id: hard
    name: Hard
    difficulty: hard
# true lets the brain see every unit, as TA's own computer player does.
fullAwareness: false
# Options the player can set; read them as me.options.<id>. For example:
# options:
#   aggressive:
#     type: toggle
#     label: "Attack early"
#     default: false
entry: brain.lua
